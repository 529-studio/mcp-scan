name: self-scan

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan the clean fixture
        run: node src/cli.js test/fixtures/good.mcp.json --fail-on high
      - name: Scan the intentionally bad fixture (report only)
        run: node src/cli.js test/fixtures/bad.mcp.json --fail-on none
